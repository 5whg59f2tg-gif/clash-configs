# HailianVPN 白嫖直登配置 —— Clash Meta / mihomo
# 生成时间: 脚本运行时; 节点来自公开订阅源实时测活 + 海连 bootstrap 节点
# 节点命名: 国旗 emoji + IP 属地（中文）+ IP，重名自动加 #2
# 说明: AUTO 组只含公共免费池（实测可用）；海连 4 台单独分组，只对 API 域放行，
#       普通网站会被节点丢弃，故不放入 AUTO。
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9091

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'stun.*'
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  fallback:
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN

